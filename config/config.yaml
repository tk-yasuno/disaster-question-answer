# MVP Disaster QA Pipeline Configuration

# Model Settings
embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
qa_model: "cl-tohoku/bert-base-japanese-v3"
max_seq_length: 512

# RAG Settings
retrieval:
  top_k: 3
  similarity_threshold: 0.7
  chunk_size: 256
  chunk_overlap: 64

# Fine-tuning Settings
fine_tuning:
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.1
  learning_rate: 2e-4
  batch_size: 8
  num_epochs: 3
  warmup_steps: 100

# Data Paths
data_paths:
  disaster_docs: "data/disaster_visual_documents"
  glossary: "data/glossary"
  processed: "data/processed"
  models: "models"

# API Settings
api:
  host: "127.0.0.1"
  port: 8000
  debug: true

# GPU Settings
device: "cpu"  # Change to "cuda" if GPU available
max_memory_mb: 4096

# Glossary Settings
glossary:
  min_similarity: 0.8
  max_candidates: 5

# Logging
logging:
  level: "INFO"
  file: "logs/disaster_qa.log"

# Fine-tuning Settings
fine_tuning:
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.1
  num_epochs: 3
  batch_size: 2
  learning_rate: 2e-5
  warmup_steps: 100
  max_seq_length: 512